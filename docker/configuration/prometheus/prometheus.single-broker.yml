global:
  scrape_interval: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: "dynamic-files"
    metrics_path: '/actuator/prometheus'
    file_sd_configs:
      - files:
          - "/etc/prometheus/dynamic/*.yml"
        refresh_interval: 30s

  - job_name: 'kafka'
    static_configs:
      - targets: ['jmx-kafka1:5556']

  - job_name: "consul"
    metrics_path: '/actuator/prometheus'
    consul_sd_configs:
      - server: 'consul:8500'
    relabel_configs:
      - action: keep
        source_labels: [ __meta_consul_service ]
        regex: kafka-event-consumer